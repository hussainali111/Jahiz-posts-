<g stroke="#a1887f" stroke-width="2.5" opacity=".7">
<line x1="122" y1="112" x2="122" y2="296"/><line x1="134" y1="112" x2="134" y2="296"/><line x1="146" y1="112" x2="146" y2="296"/><line x1="158" y1="112" x2="158" y2="296"/><line x1="170" y1="112" x2="170" y2="296"/><line x1="180" y1="112" x2="180" y2="296"/>
</g>
<!-- glass shine -->
<path d="M92 104 v180 q0 24 18 32" fill="none" stroke="#fff" stroke-width="7" opacity=".45" stroke-linecap="round"/>
