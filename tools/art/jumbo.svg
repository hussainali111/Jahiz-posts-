<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="330" height="374">
<defs>
<linearGradient id="bl" x1="0" x2="1"><stop offset="0" stop-color="#1565c0"/><stop offset=".35" stop-color="#42a5f5"/><stop offset=".6" stop-color="#1e88e5"/><stop offset="1" stop-color="#0d47a1"/></linearGradient>
<linearGradient id="cap" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fafafa"/><stop offset="1" stop-color="#cfcfcf"/></linearGradient>
<linearGradient id="pipe" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#bdbdbd"/><stop offset=".5" stop-color="#f5f5f5"/><stop offset="1" stop-color="#9e9e9e"/></linearGradient>
<linearGradient id="cart" x1="0" x2="1"><stop offset="0" stop-color="#d7ccc8"/><stop offset=".5" stop-color="#fff8e1"/><stop offset="1" stop-color="#bcaaa4"/></linearGradient>
</defs>
<!-- pipes -->
<rect x="0" y="52" width="80" height="26" fill="url(#pipe)" rx="4"/>
<rect x="220" y="52" width="80" height="26" fill="url(#pipe)" rx="4"/>
<path d="M14 40 l-12 25 l12 25" fill="none" stroke="#D51115" stroke-width="0"/>
