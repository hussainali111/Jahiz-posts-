<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e4dc"/><stop offset="1" stop-color="#cfc7bb"/></linearGradient>
  <linearGradient id="foil" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8d949b"/><stop offset=".18" stop-color="#e9edf0"/><stop offset=".35" stop-color="#bfc6cc"/>
    <stop offset=".6" stop-color="#f5f7f8"/><stop offset=".82" stop-color="#9aa2a9"/><stop offset="1" stop-color="#6f777e"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7d774"/><stop offset="1" stop-color="#d9a93a"/></linearGradient>
  <pattern id="rib" width="22" height="200" patternUnits="userSpaceOnUse"><rect width="22" height="200" fill="none"/><path d="M11 0V200" stroke="#5f666d" stroke-width="2.4" opacity=".45"/><path d="M15 0V200" stroke="#fff" stroke-width="2" opacity=".5"/></pattern>
  <radialGradient id="dark" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1f2326"/><stop offset="1" stop-color="#3b4248"/></radialGradient>
  <clipPath id="duct"><path d="M-20 205 C150 180 330 200 660 175 L660 395 C330 420 150 400 -20 425 Z"/></clipPath>
</defs>
<rect width="640" height="640" fill="url(#bg)"/>
<!-- ceiling joists -->
<g fill="#b9ad9b"><rect x="0" y="0" width="640" height="40"/><rect x="60" y="40" width="34" height="600" opacity=".35"/><rect x="330" y="40" width="34" height="600" opacity=".35"/></g>
<!-- duct body -->
<g clip-path="url(#duct)">
  <rect x="-20" y="170" width="700" height="260" fill="url(#foil)"/>
  <rect x="-20" y="170" width="700" height="260" fill="url(#rib)"/>
</g>
<path d="M-20 205 C150 180 330 200 660 175" stroke="#5c6369" stroke-width="3" fill="none"/>
<path d="M-20 425 C150 400 330 420 660 395" stroke="#4d545a" stroke-width="3" fill="none"/>
<!-- tear: hole showing dark inside + insulation -->
<path d="M235 230 L262 214 L300 236 L338 210 L372 232 L405 220 L428 262 L418 300 L440 335 L405 372 L360 360 L322 388 L288 362 L250 378 L228 335 L240 300 L220 268 Z" fill="url(#glass)" stroke="#a87b1d" stroke-width="2"/>
<path d="M268 250 L300 262 L335 244 L370 262 L398 258 L408 300 L396 338 L360 340 L322 356 L290 340 L262 345 L254 305 L262 280 Z" fill="url(#dark)"/>
<!-- fiber texture -->
<g stroke="#b88a24" stroke-width="1.6" opacity=".7" fill="none">
  <path d="M240 240q10 8 4 18M424 268q-8 10 0 20M432 330q-10 4-14 14M246 360q10-6 18 2M300 380q4-10 14-10M380 362q-6-8 4-14M330 222q6 8-2 14"/>
</g>
<!-- hanging torn foil flaps -->
<path d="M300 362 L322 388 L316 470 L298 440 L292 470 L284 420 Z" fill="#d7dde1" stroke="#7c848b" stroke-width="2"/>
<path d="M360 360 L405 372 L398 430 L384 405 L372 445 L366 400 Z" fill="#c4cbd0" stroke="#7c848b" stroke-width="2"/>
<!-- insulation hanging -->
<path d="M250 378 L288 362 L282 430 Q268 470 256 440 Q244 470 238 430 Z" fill="url(#glass)" stroke="#a87b1d" stroke-width="2"/>
<!-- crack lines -->
<g stroke="#4a5157" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M440 335 L470 320 L490 340 L520 326"/><path d="M220 268 L190 280 L170 262 L140 274"/>
</g>
<!-- leaking cold air -->
<g stroke="#4fc3f7" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9">
  <path d="M330 300 C 330 230 290 200 300 140"/><path d="M360 300 C 380 230 420 210 430 150"/><path d="M300 300 C 270 240 230 230 200 170"/>
</g>
<g fill="#4fc3f7"><path d="M300 128 l-16 22 h32z"/><path d="M432 138 l-20 18 l30 8z"/><path d="M196 156 l-6 26 l28 -8z"/></g>
<!-- dust/drip -->
<g fill="#7d6a4e" opacity=".6"><circle cx="300" cy="500" r="4"/><circle cx="318" cy="530" r="3"/><circle cx="270" cy="515" r="3"/><circle cx="380" cy="490" r="3"/></g>
<!-- warning badge -->
<g transform="translate(520 470)">
  <path d="M0 -70 L70 55 H-70 Z" fill="#D51115" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
  <rect x="-7" y="-28" width="14" height="48" rx="6" fill="#fff"/><circle cx="0" cy="36" r="8" fill="#fff"/>
</g>
</svg>
